name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.5"
  NATIVE_CACHE_V: "4"

jobs:
  # ------------------------------------------------------------------
  # Detect which parts of the repo exist (job-level `if` cannot use
  # hashFiles, so a tiny job exports the facts)
  # ------------------------------------------------------------------
  detect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      has_app: ${{ steps.check.outputs.has_app }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: |
          if [ -f app/pubspec.yaml ]; then echo "has_app=true" >> "$GITHUB_OUTPUT";
          else echo "has_app=false" >> "$GITHUB_OUTPUT"; fi

  # ------------------------------------------------------------------
  # Rust core: fmt, clippy, unit + e2e tests (mock engine, linux)
  # ------------------------------------------------------------------
  core-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "core -> target"
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy -p bitte-core -p bitte-ffi -p bitte-bt --tests -- -D warnings
      - name: unit + e2e tests
        run: cargo test -p bitte-core
      - name: check ffi (mock engine)
        run: cargo check -p bitte-ffi
      - name: check ffi (native-bt feature, no link)
        run: cargo check -p bitte-ffi --features native-bt

  # ------------------------------------------------------------------
  # Flutter app: analyze + widget tests
  # ------------------------------------------------------------------
  app-analyze:
    needs: detect
    if: needs.detect.outputs.has_app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  # ------------------------------------------------------------------
  # Real-engine FFI smoke test on linux (catches Rust<->C++ JSON contract
  # drift that mock-engine tests cannot see)
  # ------------------------------------------------------------------
  native-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "core -> target"
      - name: system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libboost-dev libssl-dev
      - name: cache host native stack
        uses: actions/cache@v4
        with:
          path: build/linux-deps
          key: native-linux-${{ env.NATIVE_CACHE_V }}-${{ hashFiles('scripts/versions.env', 'core/bitte-bt/cpp/*') }}
      - name: build host libtorrent + wrapper
        run: bash scripts/build-linux-native.sh
      - name: smoke test against real libtorrent
        working-directory: core
        run: |
          BITTE_BT_PREFIX="$GITHUB_WORKSPACE/build/linux-deps/deps" \
            cargo test -p bitte-core --features native-bt --test native_smoke -- --nocapture --test-threads=1

  # ------------------------------------------------------------------
  # Android: OpenSSL + libtorrent + C++ wrapper + Rust cdylib + APK
  # ------------------------------------------------------------------
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Rust toolchain (android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "core -> target"

      - name: Restore native deps cache
        uses: actions/cache@v4
        with:
          path: |
            build/android-deps/downloads
            build/android-deps/src
            build/android-deps/deps
            build/android-deps/build
          key: native-${{ env.NATIVE_CACHE_V }}-${{ runner.os }}-${{ hashFiles('scripts/versions.env') }}-${{ hashFiles('core/bitte-bt/cpp/*') }}
          restore-keys: |
            native-${{ env.NATIVE_CACHE_V }}-${{ runner.os }}-

      - name: Show NDK
        run: |
          echo "NDK=$ANDROID_NDK_LATEST_HOME"
          cat "$ANDROID_NDK_LATEST_HOME/source.properties" | head -2

      - name: Build native stack
        run: bash scripts/build-android-native.sh

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/gradle/wrapper/gradle-wrapper.properties', 'app/android/app/build.gradle.kts', 'app/android/build.gradle.kts', 'app/android/settings.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Flutter setup
        if: ${{ hashFiles('app/pubspec.yaml') != '' }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build APK (split per ABI)
        if: ${{ hashFiles('app/pubspec.yaml') != '' }}
        working-directory: app
        run: |
          flutter pub get
          # Per-ABI release packages instead of one universal APK: every phone
          # downloads only its own architecture (~half the bytes — see
          # docs/APK-SIZE.md §4 "分 ABI 发布"). Restricted to the ABIs we build
          # the native core for (arm64-v8a + x86_64); the gradle abiFilters +
          # jniLibs excludes keep armeabi-v7a engine libs out of the packages.
          flutter build apk --release --split-per-abi \
            --target-platform android-arm64,android-x64

      - name: List outputs
        run: |
          find app/android/app/src/main/jniLibs -type f | sort || true
          ls -la app/build/app/outputs/flutter-apk/ 2>/dev/null || true

      # Release assets must be self-describing: `app-arm64-v8a-release.apk`
      # says nothing about which app or version it is once it sits in a
      # Downloads folder next to every other APK. Name each split
      # BitteChat-<version>-android-<abi>.apk from the pubspec version (+build)
      # and upload THOSE so the Release carries the same names.
      - name: Name the APKs (app + version + abi)
        id: apkname
        run: |
          set -euo pipefail
          VER=$(sed -n 's/^version:[[:space:]]*\([0-9][^+]*\).*/\1/p' app/pubspec.yaml)
          BUILD=$(sed -n 's/^version:[[:space:]]*[^+]*+\([0-9]*\).*/\1/p' app/pubspec.yaml)
          [ -n "$VER" ] || { echo "cannot read version from app/pubspec.yaml"; exit 1; }
          DIR=app/build/app/outputs/flutter-apk
          for abi in arm64-v8a x86_64; do
            SRC="$DIR/app-${abi}-release.apk"
            [ -f "$SRC" ] || { echo "::error::missing split APK $SRC"; exit 1; }
            cp "$SRC" "$DIR/BitteChat-v${VER}+${BUILD:-0}-android-${abi}.apk"
          done
          echo "apk_version=$VER" >> "$GITHUB_OUTPUT"
          ls -la "$DIR"

      - name: Upload APKs
        if: ${{ hashFiles('app/build/app/outputs/flutter-apk/BitteChat-*.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: bittechat-apk-${{ github.sha }}
          path: |
            app/build/app/outputs/flutter-apk/BitteChat-*.apk
          retention-days: 14
          if-no-files-found: warn

      - name: Upload jniLibs for emulator job
        if: ${{ hashFiles('app/android/app/src/main/jniLibs/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: jnilibs-${{ github.sha }}
          path: app/android/app/src/main/jniLibs/**
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload native libs (debug aid)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-build-logs-${{ github.sha }}
          path: |
            build/android-deps/build/cpp-*/CMakeFiles/*.dir/*.log
          retention-days: 5
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # On-device smoke: install into an Android emulator and run the
  # integration test against the REAL libtorrent engine + REAL DHT.
  # Non-gating (continue-on-error) while the harness matures.
  # ------------------------------------------------------------------
  emulator-smoke:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    continue-on-error: true
    needs: [android]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Restore native libs from android job
        uses: actions/download-artifact@v4
        with:
          name: jnilibs-${{ github.sha }}
          path: app/android/app/src/main/jniLibs
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
      - name: Generate real test video (H.264 + AAC, 6s)
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -y -f lavfi -i testsrc2=size=640x360:rate=25 \
            -f lavfi -i sine=frequency=440:sample_rate=44100 \
            -t 6 -c:v libx264 -pix_fmt yuv420p -profile:v high -level 3.1 \
            -c:a aac -b:a 64k -movflags +faststart /tmp/ci_video.mp4
          ls -la /tmp/ci_video.mp4
      - name: Run integration tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -camera-back none
          script: |
            adb wait-for-device && adb push /tmp/ci_video.mp4 /data/local/tmp/ci_video.mp4 && adb shell chmod 644 /data/local/tmp/ci_video.mp4
            cd app && flutter pub get && flutter test integration_test/app_test.dart -d emulator-5554 --reporter expanded && flutter test integration_test/video_test.dart -d emulator-5554 --reporter expanded

  # ------------------------------------------------------------------
  # Release on tag
  # ------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, core-test, native-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bittechat-apk-*
          merge-multiple: true
          path: apks
      # the artifact already holds the descriptive name from the android job;
      # fail loudly instead of publishing a release with no APK attached
      - name: Check the APK landed
        run: |
          ls -la apks
          test -n "$(ls -A apks/*.apk 2>/dev/null)" || {
            echo "::error::no APK to publish"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          files: apks/*.apk
          name: BitteChat ${{ github.ref_name }}
          generate_release_notes: true
