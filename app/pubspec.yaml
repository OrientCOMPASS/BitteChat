name: bittechat
description: "BitteChat — 去中心化 BitTorrent 群聊客户端（种子即群聊，消息哈希链防篡改）"
publish_to: "none"
version: 0.3.0+3

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ">=2.1.0 <3.0.0"
  path_provider: ">=2.1.0 <3.0.0"
  file_picker: ">=10.0.0 <14.0.0"
  qr_flutter: ">=4.1.0 <5.0.0"
  url_launcher: ">=6.2.0 <7.0.0"
  intl: ">=0.19.0 <1.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <8.0.0"

flutter:
  uses-material-design: true
