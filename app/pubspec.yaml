name: bittechat
description: "BitteChat — 去中心化 BitTorrent 群聊客户端（种子即群聊，消息哈希链防篡改）"
publish_to: "none"
version: 0.5.2+7

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  ffi: ">=2.1.0 <3.0.0"
  path_provider: ">=2.1.0 <3.0.0"
  file_picker: ">=10.0.0 <14.0.0"
  qr_flutter: ">=4.1.0 <5.0.0"
  url_launcher: ">=6.2.0 <7.0.0"
  intl: ">=0.19.0 <1.0.0"
  audioplayers: ">=5.0.0 <7.0.0"
  # media_kit (libmpv) — the video stack proven by PiliPala/PiliPlus on the
  # same Flutter 3.47.x + mainstream Android hardware. Versions are the
  # fork's; the dependency_overrides below point every media_kit package at
  # the maintained MIT fork (fresh libmpv binaries, 16KB-page aligned,
  # current-Flutter build fixes) — the overrides are REQUIRED because the
  # fork packages reference each other as hosted deps and pub refuses to mix
  # hosted+git sources without them (same layout as PiliPlus).
  media_kit: 1.1.11
  media_kit_video: 1.2.5
  media_kit_libs_android_video: 1.3.7
  media_kit_native_event_loop: 1.0.9


dependency_overrides:
  media_kit:
    git:
      url: https://github.com/My-Responsitories/media-kit.git
      path: media_kit
      ref: 73771ec38176be2d984a3049c28177bce23b54a0
  media_kit_video:
    git:
      url: https://github.com/My-Responsitories/media-kit.git
      path: media_kit_video
      ref: 73771ec38176be2d984a3049c28177bce23b54a0
  media_kit_libs_android_video:
    git:
      url: https://github.com/My-Responsitories/media-kit.git
      path: libs/android/media_kit_libs_android_video
      ref: 73771ec38176be2d984a3049c28177bce23b54a0
  media_kit_native_event_loop:
    git:
      url: https://github.com/My-Responsitories/media-kit.git
      path: media_kit_native_event_loop
      ref: 73771ec38176be2d984a3049c28177bce23b54a0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <8.0.0"

flutter:
  generate: true
  uses-material-design: true
